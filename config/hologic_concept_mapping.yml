# Hologic APEX DICOM concept code mapping
#
# Format:  list of entries, each with:
#   code_value            DICOM CodeValue (string)
#   coding_scheme         CodingSchemeDesignator
#   code_meaning          Human-readable label from DICOM standard or Hologic docs
#   canonical_name        Snake-case identifier for use inside this pipeline
#   tissue_component      fat | lean | bmc | total | pct_fat | bmd | area | other
#   anatomic_region       whole_body | head | trunk | arms | legs | left | right |
#                         arm_left | arm_right | leg_left | leg_right | spine |
#                         femur | forearm | none
#   confidence            high | medium | low
#   note                  (optional) explanation for low-confidence entries
#
# Sources consulted:
#   DICOM PS3.16 (Content Mapping Resource) CID 7181, 7182, 7460, 7464
#   SNOMED CT body structure hierarchy
#   LOINC 2.77 DXA panel codes
#   Hologic APEX SR examples (empirical observation — no official SDK docs)
#
# ─────────────────────────────────────────────────────────────────────────────
# Body-composition quantities
# ─────────────────────────────────────────────────────────────────────────────

