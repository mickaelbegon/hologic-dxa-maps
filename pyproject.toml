[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "hologic-dxa"
version = "0.1.0"
description = "Reproducible pipeline for extracting and reconstructing quantitative maps from Hologic DXA DICOM files"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Mickael Begon", email = "mickael.begon@umontreal.ca" },
]
keywords = ["DXA", "DICOM", "Hologic", "bone-density", "medical-imaging", "biomechanics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.11"
dependencies = [
  "pydicom>=2.4",
  "highdicom>=0.22",
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "pydantic>=2.6",
  "h5py>=3.10",
  "zarr>=2.18",
  "pint>=0.23",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "types-PyYAML",
]
bodyloop = [
  "trimesh>=4.3",
  "open3d>=0.18; sys_platform != 'win32'",
]
all = ["hologic-dxa[dev,bodyloop]"]

[project.scripts]
hologic-dxa = "hologic_dxa.cli:app"

[project.urls]
Homepage = "https://github.com/mickaelbegon/hologic-dxa-maps"
Repository = "https://github.com/mickaelbegon/hologic-dxa-maps"
Issues = "https://github.com/mickaelbegon/hologic-dxa-maps/issues"
Documentation = "https://github.com/mickaelbegon/hologic-dxa-maps/blob/main/README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/hologic_dxa"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # flake8-bugbear
  "S",         # flake8-bandit (security)
  "ANN",       # flake8-annotations
  "RUF",       # ruff-specific
]
ignore = [
  "ANN101",    # missing type annotation for self
  "ANN102",    # missing type annotation for cls
  "S101",      # use of assert (allowed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["pydicom.*", "highdicom.*", "h5py.*", "zarr.*", "trimesh.*", "open3d.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
tmp_path_retention_policy = "failed"
addopts = [
  "--strict-markers",
  "--tb=short",
  "-v",
  "--basetemp=.pytest_tmp",
]
markers = [
  "real_data: requires real DICOM files (skipped by default)",
  "slow: tests that take more than a few seconds",
  "experimental: tests for experimental/unvalidated features",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
]

# ---------------------------------------------------------------------------
# bandit
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["src"]
skips = ["B101"]   # allow assert in source (caught by ruff in tests only)
